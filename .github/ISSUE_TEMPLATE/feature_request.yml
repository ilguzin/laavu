name: Feature request
description: A new feature or a change in behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving
      description: What you are doing and what gets in the way now.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it now
