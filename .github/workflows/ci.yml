# Tests on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The same targets as the release build: laavu also runs on the owner's laptop.
      - name: Release targets build
        run: |
          for t in linux/amd64 linux/arm64; do GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/laavud; done
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go vet ./cmd/laavu
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/laavu
          done
      - name: Tests
        run: |
          sudo apt-get install -y tmux
          make test

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install.sh against a test release
        run: test/installer.sh

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencies
        run: |
          sudo apt-get install -y tmux
          cd test/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Playwright
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          # Screenshots and traces of failed tests, and the laavud dev logs.
          path: |
            test/e2e/test-results
            test/e2e/.server-*.log
          include-hidden-files: true
