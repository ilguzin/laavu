# Release build on a v* tag. There is no signing here, and there must not be:
# the project key is not kept in CI. The workflow builds the binaries and an
# unsigned manifest.json into a draft release. The owner then downloads the
# manifest, signs it (laavu release sign), uploads manifest.json.sig and
# publishes the draft. See docs/dev.md, "Releases".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag and key
        env:
          PROJECT_KEY: ${{ vars.LAAVU_PROJECT_KEY }}
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRE]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points to a commit that is not on main"; exit 1; }
          [ -n "$PROJECT_KEY" ] \
            || { echo "::error::repository variable LAAVU_PROJECT_KEY is empty, binaries would not know the project key"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          sudo apt-get install -y tmux
          go vet ./...
          go test ./...
      - name: Client
        run: make web
      - name: Binaries
        env:
          PROJECT_KEY: ${{ vars.LAAVU_PROJECT_KEY }}
        run: |
          mkdir -p dist
          V=${GITHUB_REF_NAME#v}
          LD="-s -w -X main.Version=$V -X github.com/ilguzin/laavu/internal/release.ProjectKey=$PROJECT_KEY"
          for arch in amd64 arm64; do
            for cmd in laavu laavud; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LD" -o dist/$cmd-linux-$arch ./cmd/$cmd
            done
          done
          # laavu for the owner's laptop: install over SSH.
          for os_arch in darwin/amd64 darwin/arm64 windows/amd64; do
            os=${os_arch%/*}; arch=${os_arch#*/}; ext=""; [ $os = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LD" -o dist/laavu-$os-$arch$ext ./cmd/laavu
          done
          test "$(dist/laavu-linux-amd64 version)" = "$V"
          go run ./cmd/laavu release manifest --dir dist --version "$V"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft $pre --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Unsigned draft: sign manifest.json and upload manifest.json.sig before publishing."
